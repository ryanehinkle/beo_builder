<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEO Builder</title>

  <style>
    :root { color-scheme: dark; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 30%, #17171a 0%, #0d0d0f 38%, #080809 72%);
      color: #f5f5f7;
    }

    #pdfInput { display: none; }

    .landing {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .landing-card {
      width: min(92vw, 440px);
      padding: 46px 36px;
      text-align: center;
      background: #18181b;
      border: 1px solid #3a3a40;
      border-radius: 12px;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 7vw, 3.35rem);
      line-height: 1;
      letter-spacing: -0.035em;
      color: #fff;
      text-shadow: 2px 2px 0 #2d2d31;
    }

    .landing h1 { margin-bottom: 30px; }

    .upload-button {
      border: 1px solid #6698d0;
      border-radius: 11px;
      padding: 15px 22px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: #5185bd;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13);
      cursor: pointer;
      transition: background .16s ease, transform .16s ease, box-shadow .16s ease;
    }

    .landing .upload-button { width: 100%; }

    .upload-button:hover {
      background: #5e93cc;
      transform: translateY(-1px);
      box-shadow: 0 8px 22px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.16);
    }

    .upload-button:active {
      transform: translateY(0);
      background: #477aaf;
    }

    .workspace {
      display: none;
      width: min(94vw, 1500px);
      margin: 0 auto;
      padding: 44px 0 72px;
    }

    .workspace.active { display: block; }

    .workspace-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }

    .workspace-title h1 { font-size: clamp(2rem, 4vw, 3rem); }

    .subtitle {
      margin-top: 9px;
      color: #9d9da7;
      font-size: .95rem;
    }

    .workspace .upload-button {
      flex: 0 0 auto;
      padding: 13px 20px;
      font-size: .98rem;
    }

    .beo-section {
      display: none;
    }

    .beo-section.visible {
      display: block;
    }

    .beo-section + .beo-section {
      margin-top: 42px;
    }

    .section-header {
      margin-bottom: 16px;
      color: #f4f4f6;
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -.01em;
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      gap: 18px;
      align-items: stretch;
    }

    .pdf-card {
      --scan-progress: 0%;
      cursor: pointer;
      min-width: 0;
      padding: 0 12px 14px;
      overflow: hidden;
      border: 1px solid #303036;
      border-radius: 12px;
      background: #18181b;
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }

    .pdf-card:hover {
      transform: translateY(-2px);
      border-color: #4a4a52;
      background: #1d1d21;
    }

    .pdf-meta {
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 0 -12px 12px;
      padding: 12px 14px 11px;
      border-bottom: 1px solid #303036;
      background: #1d1d21;
    }

    .pdf-date {
      color: #fff;
      font-size: 1.08rem;
      font-weight: 750;
      letter-spacing: -.01em;
    }

    .pdf-events {
      margin-top: 4px;
      color: #9898a2;
      font-size: .82rem;
      font-weight: 600;
    }

    .loading-text { color: #70707a; }

    .pdf-preview {
      position: relative;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 7px;
      background: #f2f2f2;
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.15);
    }

    .pdf-preview canvas {
      display: block;
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: 100%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }

    .preview-loading {
      color: #505058;
      font-size: .82rem;
      font-weight: 700;
    }

    .scan-overlay {
      position: absolute;
      inset: 0 auto auto 0;
      z-index: 2;
      width: 100%;
      height: var(--scan-progress);
      pointer-events: none;
      opacity: 1;
      background: linear-gradient(180deg, rgba(82,133,189,.30), rgba(82,133,189,.13));
      border-bottom: 1px solid rgba(121,177,237,.85);
      box-shadow: 0 8px 20px rgba(81,133,189,.12);
      transition: height .22s ease, opacity .3s ease;
    }

    .scan-label {
      position: absolute;
      left: 50%;
      bottom: 12px;
      z-index: 3;
      transform: translateX(-50%);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
      color: #34343b;
      font-size: .71rem;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      transition: opacity .2s ease;
    }

    .pdf-card.loaded .scan-overlay,
    .pdf-card.loaded .scan-label {
      opacity: 0;
      pointer-events: none;
    }

    .pdf-error {
      padding: 18px;
      color: #b94747;
      text-align: center;
      font-size: .85rem;
    }

    .pdf-name {
      margin-top: 11px;
      overflow: hidden;
      color: #dedee4;
      font-size: .88rem;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .merge-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      margin-top: 52px;
      padding-top: 28px;
      border-top: 1px solid #25252b;
    }

    .merge-options {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
    }

    .options-label {
      color: #8f8f99;
      font-size: .76rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .segmented-control {
      display: flex;
      padding: 4px;
      border: 1px solid #34343b;
      border-radius: 11px;
      background: #18181c;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }

    .segmented-control input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segmented-control label {
      padding: 9px 14px;
      border-radius: 8px;
      color: #94949e;
      font-size: .84rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
      user-select: none;
    }

    .segmented-control input:checked + label {
      background: #2b2b31;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,.22);
    }

    .segmented-control input:focus-visible + label {
      outline: 2px solid rgba(103,162,226,.55);
      outline-offset: 2px;
    }

    .checkbox-option {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-top: 3px;
      color: #b5b5be;
      font-size: .84rem;
      font-weight: 650;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-option input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #5185bd;
      cursor: pointer;
    }

    .merge-button {
      min-width: 210px;
      border: 1px solid #63a97a;
      border-radius: 12px;
      padding: 16px 34px;
      background: #3f8f5d;
      color: #fff;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.13);
      transition: background .16s ease, transform .16s ease, opacity .16s ease;
    }

    .merge-button:hover:not(:disabled) {
      background: #49a36a;
      transform: translateY(-1px);
    }

    .merge-button:disabled {
      opacity: .5;
      cursor: default;
    }

    .pdf-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(4, 4, 6, .56);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .pdf-modal.open {
      display: flex;
    }

    .modal-window {
      position: relative;
      width: fit-content;
      max-width: 96vw;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .modal-topbar {
      position: relative;
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .page-counter {
      padding: 7px 11px;
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      background: rgba(24,24,28,.92);
      color: #d2d2d8;
      font-size: .82rem;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 16px rgba(0,0,0,.28);
    }

    .modal-close {
      position: absolute;
      top: 4px;
      right: 2px;
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: rgba(24,24,28,.82);
      color: #a8a8b0;
      font: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      transition: background .15s ease, color .15s ease;
    }

    .modal-close:hover {
      background: #28282e;
      color: #fff;
    }

    .modal-body {
      position: relative;
      width: fit-content;
      max-width: 96vw;
      max-height: calc(96vh - 50px);
      overflow: auto;
      padding: 0 56px;
    }

    .modal-canvas-wrap {
      width: fit-content;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-arrow {
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 42px;
      height: 64px;
      display: grid;
      place-items: center;
      transform: translateY(-50%);
      border: 0;
      border-radius: 10px;
      background: rgba(30, 30, 35, .72);
      color: #d8d8de;
      font: inherit;
      font-size: 2rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      transition: background .15s ease, color .15s ease, opacity .15s ease;
    }

    .page-arrow:hover:not(:disabled) {
      background: rgba(48, 48, 55, .94);
      color: #fff;
    }

    .page-arrow:disabled {
      opacity: .18;
      cursor: default;
    }

    .page-arrow.prev { left: 10px; }
    .page-arrow.next { right: 10px; }

    #modalCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 4px 22px rgba(0, 0, 0, .4);
    }

    .modal-loading {
      margin-top: 40px;
      color: #92929c;
      font-size: .9rem;
    }

    @media (max-width: 1350px) {
      .pdf-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
      }
    }

    @media (max-width: 1050px) {
      .pdf-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 780px) {
      .pdf-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 650px) {
      .workspace {
        width: min(92vw, 1500px);
        padding-top: 28px;
      }

      .workspace-header {
        align-items: stretch;
        flex-direction: column;
        margin-bottom: 28px;
      }

      .workspace .upload-button { width: 100%; }

      .pdf-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .pdf-preview { height: 180px; }
    }

    @media (max-width: 420px) {
      .pdf-grid { grid-template-columns: 1fr; }
      .pdf-preview { height: 230px; }
    }
  </style>
</head>

<body>
  <input id="pdfInput" type="file" accept="application/pdf,.pdf" multiple />

  <main id="landing" class="landing">
    <section class="landing-card">
      <h1>BEO Builder</h1>
      <button class="upload-button upload-trigger" type="button">Upload BEOs</button>
    </section>
  </main>

  <main id="workspace" class="workspace">
    <header class="workspace-header">
      <div class="workspace-title">
        <h1>BEO Builder</h1>
        <p class="subtitle">Uploaded BEO PDFs</p>
      </div>
      <button class="upload-button upload-trigger" type="button">Add BEOs</button>
    </header>

    <section id="managerSection" class="beo-section">
      <h2 class="section-header">Manager BEOs</h2>
      <div id="managerGrid" class="pdf-grid" aria-live="polite"></div>
    </section>

    <section id="kitchenSection" class="beo-section">
      <h2 class="section-header">Kitchen BEOs</h2>
      <div id="kitchenGrid" class="pdf-grid" aria-live="polite"></div>
    </section>

    <div class="merge-area">
      <div class="merge-options">
        <div class="options-label">Options</div>
        <div class="segmented-control" role="radiogroup" aria-label="Merge output">
          <input id="printableMode" type="radio" name="mergeMode" value="printable" checked />
          <label for="printableMode">Printable</label>

          <input id="noBlanksMode" type="radio" name="mergeMode" value="no-blanks" />
          <label for="noBlanksMode">Remove blank pages</label>
        </div>

        <label class="checkbox-option" for="removeKitchenFlexes">
          <input id="removeKitchenFlexes" type="checkbox" checked />
          <span>Remove flexes from Kitchen BEOs</span>
        </label>
      </div>

      <button id="mergeButton" class="merge-button" type="button" disabled>Merge</button>
    </div>
  </main>

  <div id="pdfModal" class="pdf-modal" aria-hidden="true">
    <section class="modal-window" role="dialog" aria-modal="true" aria-label="PDF preview">
      <div class="modal-topbar">
        <div id="pageCounter" class="page-counter">1 of 1</div>
        <button id="modalClose" class="modal-close" type="button" aria-label="Close preview">×</button>
      </div>

      <div class="modal-body">
        <button id="prevPage" class="page-arrow prev" type="button" aria-label="Previous page">‹</button>

        <div id="modalCanvasWrap" class="modal-canvas-wrap">
          <canvas id="modalCanvas"></canvas>
        </div>

        <button id="nextPage" class="page-arrow next" type="button" aria-label="Next page">›</button>
      </div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script type="module">
    import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";

    const { PDFDocument } = window.PDFLib;

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";

    const pdfInput = document.getElementById("pdfInput");
    const landing = document.getElementById("landing");
    const workspace = document.getElementById("workspace");
    const managerSection = document.getElementById("managerSection");
    const kitchenSection = document.getElementById("kitchenSection");
    const managerGrid = document.getElementById("managerGrid");
    const kitchenGrid = document.getElementById("kitchenGrid");
    const uploadTriggers = document.querySelectorAll(".upload-trigger");
    const pdfModal = document.getElementById("pdfModal");
    const modalClose = document.getElementById("modalClose");
    const prevPage = document.getElementById("prevPage");
    const nextPage = document.getElementById("nextPage");
    const pageCounter = document.getElementById("pageCounter");
    const modalCanvas = document.getElementById("modalCanvas");
    const modalCanvasWrap = document.getElementById("modalCanvasWrap");
    const mergeButton = document.getElementById("mergeButton");
    const removeKitchenFlexes = document.getElementById("removeKitchenFlexes");

    const pdfDocuments = new WeakMap();
    const pdfSourceBytes = new WeakMap();
    const pdfBlankPages = new WeakMap();
    const pdfKitchenFlexPages = new WeakMap();
    const pdfSyntheticBlankIndex = new WeakMap();

    let uploadOrder = 0;
    let pendingFiles = 0;
    let activePdf = null;
    let activePage = 1;
    let modalRenderTask = null;
    let previewFrameWidth = 0;
    let previewFrameHeight = 0;

    uploadTriggers.forEach((button) => {
      button.addEventListener("click", () => pdfInput.click());
    });

    pdfInput.addEventListener("change", (event) => {
      const files = Array.from(event.target.files || []).filter(
        (file) => file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")
      );

      if (!files.length) return;

      landing.style.display = "none";
      workspace.classList.add("active");

      pendingFiles += files.length;
      updateMergeButton();

      for (const file of files) addPdfCard(file);
      pdfInput.value = "";
    });

    async function addPdfCard(file) {
      const order = uploadOrder++;

      const card = document.createElement("article");
      card.className = "pdf-card";
      card.dataset.sortDate = String(Number.MAX_SAFE_INTEGER);
      card.dataset.uploadOrder = String(order);

      const meta = document.createElement("div");
      meta.className = "pdf-meta";

      const dateLabel = document.createElement("div");
      dateLabel.className = "pdf-date loading-text";
      dateLabel.textContent = "Reading date…";

      const eventLabel = document.createElement("div");
      eventLabel.className = "pdf-events loading-text";
      eventLabel.textContent = "Counting events…";

      meta.append(dateLabel, eventLabel);

      const preview = document.createElement("div");
      preview.className = "pdf-preview";

      const previewLoading = document.createElement("div");
      previewLoading.className = "preview-loading";
      previewLoading.textContent = "Loading preview…";

      const scanOverlay = document.createElement("div");
      scanOverlay.className = "scan-overlay";

      const scanLabel = document.createElement("div");
      scanLabel.className = "scan-label";
      scanLabel.textContent = "Reading BEOs…";

      preview.append(previewLoading, scanOverlay, scanLabel);

      const name = document.createElement("div");
      name.className = "pdf-name";
      name.textContent = file.name;
      name.title = file.name;

      card.append(meta, preview, name);
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "Open PDF preview for " + file.name);

      card.addEventListener("click", () => {
        const pdf = pdfDocuments.get(card);
        if (pdf) openPdfPreview(pdf);
      });

      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          const pdf = pdfDocuments.get(card);
          if (pdf) openPdfPreview(pdf);
        }
      });

      managerSection.classList.add("visible");
      managerGrid.appendChild(card);

      try {
        const originalBytes = new Uint8Array(await file.arrayBuffer());
        const normalized = await ensureEvenPageCount(originalBytes);
        const normalizedBytes = normalized.bytes;

        // Keep a separate copy for merging because PDF.js may transfer/detach its input buffer.
        pdfSourceBytes.set(card, normalizedBytes.slice());
        pdfSyntheticBlankIndex.set(
          card,
          normalized.addedBlank ? normalized.originalPageCount : null
        );

        const pdf = await pdfjsLib.getDocument({ data: normalizedBytes.slice() }).promise;
        pdfDocuments.set(card, pdf);

        let firstPageText = "";
        const beoNumbers = new Set();
        const blankPages = new Set();
        const eventPages = new Map();

        for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {
          const page = await pdf.getPage(pageNumber);

          if (pageNumber === 1) {
            await renderThumbnail(page, preview, scanOverlay, scanLabel);
          }

          const textContent = await page.getTextContent();
          const pageText = textContent.items.map((item) => item.str).join(" ");

          if (await isBlankPage(page, textContent)) {
            blankPages.add(pageNumber - 1);
          }

          if (pageNumber === 1) firstPageText = pageText;

          const beoMatch = pageText.match(/BEO\s*#\s*(\d+)/i);
          if (beoMatch) {
            const beoNumber = beoMatch[1];
            beoNumbers.add(beoNumber);

            if (!eventPages.has(beoNumber)) {
              eventPages.set(beoNumber, {
                pages: [],
                hasKitchenItems: false,
                hasEventNotes: false,
                hasEventHeader: false
              });
            }

            const event = eventPages.get(beoNumber);
            event.pages.push(pageNumber - 1);
            event.hasKitchenItems ||= hasKitchenItems(pageText);
            event.hasEventNotes ||= /EVENT\s+NOTES/i.test(pageText);
            event.hasEventHeader ||= /Event\s*Date:/i.test(pageText);
          }

          const progress = Math.max(8, Math.round((pageNumber / pdf.numPages) * 100));
          card.style.setProperty("--scan-progress", progress + "%");
          scanLabel.textContent = "Reading BEOs… " + progress + "%";
        }

        pdfBlankPages.set(card, blankPages);

        const beoType = detectBeoType(firstPageText);
        const kitchenFlexPages = new Set();

        if (beoType === "kitchen") {
          for (const event of eventPages.values()) {
            const isEmptyKitchenEvent =
              event.hasEventHeader &&
              event.hasEventNotes &&
              !event.hasKitchenItems;

            if (isEmptyKitchenEvent) {
              event.pages.forEach((pageIndex) => kitchenFlexPages.add(pageIndex));
            }
          }
        }

        pdfKitchenFlexPages.set(card, kitchenFlexPages);

        if (beoType === "kitchen") {
          kitchenSection.classList.add("visible");
          kitchenGrid.appendChild(card);
        } else {
          managerSection.classList.add("visible");
          managerGrid.appendChild(card);
        }

        updateSectionVisibility();

        const eventDate = extractEventDate(firstPageText);

        if (eventDate) {
          dateLabel.textContent = formatEventDate(eventDate);
          dateLabel.classList.remove("loading-text");
          card.dataset.sortDate = String(eventDate.getTime());
        } else {
          dateLabel.textContent = "Date not found";
        }

        const eventCount = beoNumbers.size;
        eventLabel.textContent =
          eventCount === 1 ? "1 event" : eventCount + " events";
        eventLabel.classList.remove("loading-text");

        sortGrid(managerGrid);
        sortGrid(kitchenGrid);
        card.classList.add("loaded");
        pendingFiles -= 1;
        updateMergeButton();
      } catch (error) {
        dateLabel.textContent = "Could not read PDF";
        eventLabel.textContent = "";
        preview.replaceChildren();

        const errorMessage = document.createElement("div");
        errorMessage.className = "pdf-error";
        errorMessage.textContent = "Could not preview PDF.";
        preview.appendChild(errorMessage);

        card.classList.add("loaded");
        pendingFiles -= 1;
        updateMergeButton();
        console.error("PDF processing failed:", error);
      }
    }

    async function renderThumbnail(page, preview, scanOverlay, scanLabel) {
      const baseViewport = page.getViewport({ scale: 1 });
      const maxWidth = 165;
      const maxHeight = 200;
      const scale = Math.min(
        maxWidth / baseViewport.width,
        maxHeight / baseViewport.height
      );

      const viewport = page.getViewport({ scale });
      const outputScale = Math.min(window.devicePixelRatio || 1, 2);

      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");

      canvas.width = Math.floor(viewport.width * outputScale);
      canvas.height = Math.floor(viewport.height * outputScale);
      canvas.style.width = Math.floor(viewport.width) + "px";
      canvas.style.height = Math.floor(viewport.height) + "px";

      await page.render({
        canvasContext: context,
        viewport,
        transform:
          outputScale !== 1
            ? [outputScale, 0, 0, outputScale, 0, 0]
            : null
      }).promise;

      preview.replaceChildren(canvas, scanOverlay, scanLabel);
    }

    async function openPdfPreview(pdf) {
      activePdf = pdf;
      activePage = 1;
      pdfModal.classList.add("open");
      pdfModal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      await setPreviewFrameFromFirstPage(pdf);

      if (activePdf === pdf) {
        renderModalPage();
      }
    }

    async function setPreviewFrameFromFirstPage(pdf) {
      const firstPage = await pdf.getPage(1);

      if (activePdf !== pdf) return;

      const baseViewport = firstPage.getViewport({ scale: 1 });
      const availableWidth = Math.min(window.innerWidth * .78, 850);
      const availableHeight = Math.max(360, window.innerHeight * .82);
      const scale = Math.min(
        availableWidth / baseViewport.width,
        availableHeight / baseViewport.height,
        1.65
      );

      const viewport = firstPage.getViewport({ scale });

      previewFrameWidth = Math.floor(viewport.width);
      previewFrameHeight = Math.floor(viewport.height);

      modalCanvasWrap.style.width = previewFrameWidth + "px";
      modalCanvasWrap.style.height = previewFrameHeight + "px";
    }

    function closePdfPreview() {
      pdfModal.classList.remove("open");
      pdfModal.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      activePdf = null;
      previewFrameWidth = 0;
      previewFrameHeight = 0;
      modalCanvasWrap.style.width = "";
      modalCanvasWrap.style.height = "";

      if (modalRenderTask) {
        try { modalRenderTask.cancel(); } catch (_) {}
        modalRenderTask = null;
      }
    }

    async function renderModalPage() {
      if (!activePdf) return;

      const pdfForRender = activePdf;
      const pageNumberForRender = activePage;

      prevPage.disabled = activePage <= 1;
      nextPage.disabled = activePage >= activePdf.numPages;
      pageCounter.textContent = activePage + " of " + activePdf.numPages;

      if (modalRenderTask) {
        try { modalRenderTask.cancel(); } catch (_) {}
        modalRenderTask = null;
      }

      modalCanvas.style.display = "none";

      let loading = modalCanvasWrap.querySelector(".modal-loading");
      if (!loading) {
        loading = document.createElement("div");
        loading.className = "modal-loading";
        loading.textContent = "Loading page…";
        modalCanvasWrap.appendChild(loading);
      }

      try {
        const page = await pdfForRender.getPage(pageNumberForRender);

        if (pdfForRender !== activePdf || pageNumberForRender !== activePage) return;

        const baseViewport = page.getViewport({ scale: 1 });
        const scale = Math.min(
          previewFrameWidth / baseViewport.width,
          previewFrameHeight / baseViewport.height,
          1.65
        );

        const viewport = page.getViewport({ scale });
        const outputScale = Math.min(window.devicePixelRatio || 1, 2);
        const context = modalCanvas.getContext("2d");

        modalCanvas.width = Math.floor(viewport.width * outputScale);
        modalCanvas.height = Math.floor(viewport.height * outputScale);
        modalCanvas.style.width = Math.floor(viewport.width) + "px";
        modalCanvas.style.height = Math.floor(viewport.height) + "px";

        modalRenderTask = page.render({
          canvasContext: context,
          viewport,
          transform:
            outputScale !== 1
              ? [outputScale, 0, 0, outputScale, 0, 0]
              : null
        });

        await modalRenderTask.promise;

        if (pdfForRender !== activePdf || pageNumberForRender !== activePage) return;

        loading.remove();
        modalCanvas.style.display = "block";
        modalRenderTask = null;
      } catch (error) {
        if (error?.name !== "RenderingCancelledException") {
          console.error("Modal PDF render failed:", error);
        }
      }
    }

    prevPage.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!activePdf || activePage <= 1) return;
      activePage -= 1;
      renderModalPage();
    });

    nextPage.addEventListener("click", (event) => {
      event.stopPropagation();
      if (!activePdf || activePage >= activePdf.numPages) return;
      activePage += 1;
      renderModalPage();
    });

    modalClose.addEventListener("click", (event) => {
      event.stopPropagation();
      closePdfPreview();
    });

    pdfModal.addEventListener("click", (event) => {
      if (event.target === pdfModal) closePdfPreview();
    });

    document.addEventListener("keydown", (event) => {
      if (!pdfModal.classList.contains("open")) return;

      if (event.key === "Escape") {
        closePdfPreview();
      } else if (event.key === "ArrowLeft" && activePage > 1) {
        activePage -= 1;
        renderModalPage();
      } else if (
        event.key === "ArrowRight" &&
        activePdf &&
        activePage < activePdf.numPages
      ) {
        activePage += 1;
        renderModalPage();
      }
    });

    function hasKitchenItems(text) {
      return (
        /\bPRODUCT\s+NAME\b/i.test(text) ||
        /\bITEM\s+NAME\b/i.test(text) ||
        /\bEvent\s+Food\b/i.test(text) ||
        /\bFood\s+TOTAL\b/i.test(text)
      );
    }

    async function isBlankPage(page, textContent) {
      const hasText = textContent.items.some(
        (item) => typeof item.str === "string" && item.str.trim().length > 0
      );

      if (hasText) return false;

      const operatorList = await page.getOperatorList();
      const OPS = pdfjsLib.OPS;

      const visibleOps = new Set([
        OPS.showText,
        OPS.showSpacedText,
        OPS.nextLineShowText,
        OPS.nextLineSetSpacingShowText,
        OPS.paintImageXObject,
        OPS.paintInlineImageXObject,
        OPS.paintImageMaskXObject,
        OPS.paintImageMaskXObjectGroup,
        OPS.paintImageXObjectRepeat,
        OPS.paintImageMaskXObjectRepeat,
        OPS.paintJpegXObject,
        OPS.shadingFill,
        OPS.constructPath,
        OPS.fill,
        OPS.eoFill,
        OPS.stroke,
        OPS.closeStroke,
        OPS.fillStroke,
        OPS.eoFillStroke,
        OPS.closeFillStroke,
        OPS.closeEOFillStroke,
        OPS.rawFillPath,
        OPS.paintFormXObjectBegin,
        OPS.beginAnnotation
      ].filter(Number.isFinite));

      return !operatorList.fnArray.some((op) => visibleOps.has(op));
    }

    async function ensureEvenPageCount(bytes) {
      const pdf = await PDFDocument.load(bytes);
      const originalPageCount = pdf.getPageCount();

      if (originalPageCount % 2 === 1) {
        const lastPage = pdf.getPage(originalPageCount - 1);
        pdf.addPage([lastPage.getWidth(), lastPage.getHeight()]);

        return {
          bytes: new Uint8Array(await pdf.save()),
          addedBlank: true,
          originalPageCount
        };
      }

      return {
        bytes,
        addedBlank: false,
        originalPageCount
      };
    }

    function updateMergeButton() {
      const hasFiles = managerGrid.children.length > 0 || kitchenGrid.children.length > 0;
      mergeButton.disabled = !hasFiles || pendingFiles > 0;
      mergeButton.textContent = pendingFiles > 0 ? "Reading BEOs…" : "Merge";
    }

    mergeButton.addEventListener("click", async () => {
      if (mergeButton.disabled) return;

      mergeButton.disabled = true;
      mergeButton.textContent = "Merging…";

      try {
        const managerCards = getSortedCards(managerGrid);
        const kitchenCards = getSortedCards(kitchenGrid);
        const removeBlanks =
          document.querySelector('input[name="mergeMode"]:checked')?.value === "no-blanks";
        const removeFlexes = removeKitchenFlexes.checked;

        if (managerCards.length) {
          const bytes = await mergeCards(managerCards, {
            removeBlanks,
            removeKitchenFlexes: false
          });
          downloadMergedPdf(
            bytes,
            buildMergedFilename("Managers", managerCards, removeBlanks)
          );
        }

        if (kitchenCards.length) {
          const bytes = await mergeCards(kitchenCards, {
            removeBlanks,
            removeKitchenFlexes: removeFlexes
          });
          downloadMergedPdf(
            bytes,
            buildMergedFilename("Kitchens", kitchenCards, removeBlanks)
          );
        }
      } catch (error) {
        console.error("PDF merge failed:", error);
        alert("Something went wrong while merging the PDFs.");
      } finally {
        mergeButton.textContent = "Merge";
        updateMergeButton();
      }
    });

    function getSortedCards(grid) {
      return Array.from(grid.children).sort((a, b) => {
        const dateDiff = Number(a.dataset.sortDate) - Number(b.dataset.sortDate);
        if (dateDiff !== 0) return dateDiff;
        return Number(a.dataset.uploadOrder) - Number(b.dataset.uploadOrder);
      });
    }

    async function mergeCards(
      cards,
      { removeBlanks = false, removeKitchenFlexes = false } = {}
    ) {
      const merged = await PDFDocument.create();

      for (const card of cards) {
        const sourceBytes = pdfSourceBytes.get(card);
        if (!sourceBytes) continue;

        const sourcePdf = await PDFDocument.load(sourceBytes);
        let pageIndices = sourcePdf.getPageIndices();

        if (removeKitchenFlexes) {
          const flexPages = pdfKitchenFlexPages.get(card) || new Set();
          pageIndices = pageIndices.filter((index) => !flexPages.has(index));

          // The synthetic trailing blank belonged to the original page balance.
          // Remove it first, then recalculate whether the remaining day's pages need one.
          const syntheticBlankIndex = pdfSyntheticBlankIndex.get(card);
          if (Number.isInteger(syntheticBlankIndex)) {
            pageIndices = pageIndices.filter((index) => index !== syntheticBlankIndex);
          }
        }

        if (removeBlanks) {
          const blankPages = pdfBlankPages.get(card) || new Set();
          pageIndices = pageIndices.filter((index) => !blankPages.has(index));
        }

        if (!pageIndices.length) continue;

        const copiedPages = await merged.copyPages(sourcePdf, pageIndices);
        copiedPages.forEach((page) => merged.addPage(page));

        // Printable mode keeps each uploaded Kitchen day on an even page count,
        // even after one or more flex-only events were removed.
        if (removeKitchenFlexes && !removeBlanks && pageIndices.length % 2 === 1) {
          const lastKeptPage = sourcePdf.getPage(pageIndices[pageIndices.length - 1]);
          merged.addPage([lastKeptPage.getWidth(), lastKeptPage.getHeight()]);
        }
      }

      return await merged.save();
    }

    function buildMergedFilename(label, cards, noBlanks = false) {
      const datedCards = cards.filter(
        (card) => Number(card.dataset.sortDate) < Number.MAX_SAFE_INTEGER
      );

      if (!datedCards.length) {
        return label + (noBlanks ? " (No blanks)" : "") + ".pdf";
      }

      const firstDate = new Date(Number(datedCards[0].dataset.sortDate));
      const lastDate = new Date(Number(datedCards[datedCards.length - 1].dataset.sortDate));

      return (
        label +
        " [" +
        formatFilenameDate(firstDate) +
        "-" +
        formatFilenameDate(lastDate) +
        "]" +
        (noBlanks ? " (No blanks)" : "") +
        ".pdf"
      );
    }

    function formatFilenameDate(date) {
      const month = String(date.getUTCMonth() + 1).padStart(2, "0");
      const day = String(date.getUTCDate()).padStart(2, "0");
      return month + "." + day;
    }

    function downloadMergedPdf(bytes, filename) {
      const blob = new Blob([bytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function detectBeoType(text) {
      if (/Kitchen\s+Catering\s+BEO/i.test(text) || /Kitchen\s+BEO/i.test(text)) {
        return "kitchen";
      }

      if (/Manager\s+Catering\s+BEO/i.test(text) || /Manager\s+BEO/i.test(text)) {
        return "manager";
      }

      return "manager";
    }

    function updateSectionVisibility() {
      managerSection.classList.toggle("visible", managerGrid.children.length > 0);
      kitchenSection.classList.toggle("visible", kitchenGrid.children.length > 0);
    }

    function extractEventDate(text) {
      const match = text.match(/Event\s*Date:\s*(\d{1,2})\/(\d{1,2})\/(\d{4})/i);
      if (!match) return null;

      const month = Number(match[1]);
      const day = Number(match[2]);
      const year = Number(match[3]);

      return new Date(Date.UTC(year, month - 1, day));
    }

    function formatEventDate(date) {
      return new Intl.DateTimeFormat("en-US", {
        weekday: "short",
        month: "short",
        day: "numeric",
        timeZone: "UTC"
      }).format(date);
    }

    function sortGrid(grid) {
      getSortedCards(grid).forEach((card) => grid.appendChild(card));
    }
  </script>
</body>
</html>
