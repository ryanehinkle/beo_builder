<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEO Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 30%, #17171a 0%, #0d0d0f 38%, #080809 72%);
      color: #f5f5f7;
    }

    main {
      width: min(92vw, 440px);
      text-align: center;
      background: #18181b;
      padding: 46px 36px;
      border: 1px solid #3a3a40;
      border-radius: 12px;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    h1 {
      margin-bottom: 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 7vw, 3.35rem);
      line-height: 1;
      letter-spacing: -0.035em;
      color: #ffffff;
      text-shadow: 2px 2px 0 #2d2d31;
    }

    .upload-button {
      width: 100%;
      border: 1px solid #6698d0;
      border-radius: 11px;
      padding: 15px 22px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      background: #5185bd;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13);
      cursor: pointer;
      transition:
        background 0.16s ease,
        transform 0.16s ease,
        box-shadow 0.16s ease;
    }

    .upload-button:hover {
      background: #5e93cc;
      transform: translateY(-1px);
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
    }

    .upload-button:active {
      transform: translateY(0);
      background: #477aaf;
    }

    .upload-button:focus-visible {
      outline: 3px solid rgba(103, 162, 226, 0.38);
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>BEO Builder</h1>
    <button class="upload-button" type="button">Upload BEO</button>
  </main>
</body>
</html>
